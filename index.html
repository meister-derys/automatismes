<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Automatismes de Première</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --bg:#f2f5f9; --surface:#ffffff; --fg:#141b27; --muted:#556075; --line:#d6dde8; --grid:#e1e7f0;
  --accent:#1d4f91; --accent-fg:#ffffff; --accent-soft:#e3ecf8;
  --ok:#17794a; --ok-soft:#dff2e7; --bad:#b0261d; --bad-soft:#fbe5e2;
  --font:"Atkinson Hyperlegible","Helvetica Neue",Arial,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:18px/1.5 var(--font);margin:0;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.in{max-width:900px;margin:0 auto}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:2rem;font-weight:700;letter-spacing:-.01em}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between;align-items:baseline;
  color:var(--muted);font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;padding-bottom:18px}
.lead{color:var(--muted);margin-top:8px;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:20px}
.m{font-size:1.08em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.2;font-size:.95em}
.fr .n{border-bottom:1.6px solid currentColor;padding:0 .25em .06em}
.fr .d{padding:.06em .25em 0}
sup{font-size:.7em;line-height:0;margin-right:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:22px}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);
  border-radius:12px;padding:18px;min-height:168px;justify-content:space-between}
.card:active{background:var(--accent-soft)}
.card-name{font-size:1.25rem;font-weight:700}
.card-desc{color:var(--muted);font-size:.9rem;line-height:1.4}
.card-ex{align-self:flex-start;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 12px;font-size:1rem;min-height:2.3em;display:inline-flex;align-items:center}
.card.bilan{border-color:var(--accent)}
details.prof{margin-top:32px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
details.prof summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}
details.prof p,details.prof ul{margin-top:10px;color:var(--muted);font-size:.92rem}
details.prof ul{padding-left:1.2em}
details.prof code{background:var(--accent-soft);color:var(--fg);border-radius:5px;padding:1px 6px;font-size:.88em;word-break:break-all}
.back{background:none;border:0;color:var(--accent);padding:10px 0;min-height:44px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:20px;margin-top:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>legend{font-weight:700;font-size:.95rem}
.field input[type=text],.field select,.field textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:52px;width:100%}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{border-color:var(--accent)}
.field textarea{font:13px/1.4 ui-monospace,Menlo,monospace;resize:vertical;min-height:140px}
.tblw{overflow-x:auto;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:.98rem;min-width:620px}
.tbl th{text-align:left;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .sc{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .mu{color:var(--muted);font-size:.85rem}
.tbl .dbtn{background:none;border:0;color:var(--accent);font-weight:700;min-height:40px;padding:0 4px}
.tbl tr.det td{background:var(--bg)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{border-radius:8px;padding:4px 10px;font-size:.85rem}
.tg.ok{background:var(--ok-soft);color:var(--ok)}
.tg.ko{background:var(--bad-soft);color:var(--bad)}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:18px}
.stats div b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.stats div span{color:var(--muted);font-size:.85rem}
.badl{margin-top:14px;font-size:.9rem;color:var(--bad)}
.badl code{word-break:break-all;font-size:.8em}
fieldset{border:0;margin:0;padding:0;min-width:0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mode{position:relative}
.mode input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.mode span{display:block;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);height:100%}
.mode b{display:block}
.mode small{display:block;color:var(--muted);font-size:.85rem;line-height:1.35;margin-top:2px}
.mode input:checked+span{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.mode input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.note{color:var(--muted);font-size:.9rem}
.err{color:var(--bad);font-weight:700;font-size:.95rem}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 22px;min-height:56px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn[disabled]{opacity:.4;cursor:default}
.btn:not([disabled]):active{filter:brightness(.92)}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:12px}
.qhead .t{font-weight:700}
.qhead .c{color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0 0 18px;padding:0}
.chip{min-width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums;padding:0 6px}
.chip.done{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.chip.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip.good{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
.chip.wrong{background:var(--bad-soft);border-color:var(--bad-soft);color:var(--bad)}
.chip[disabled]{cursor:default}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:20px}
.prompt{font-size:1.3rem;line-height:1.55}
.fig{display:flex;justify-content:center}
.fig svg{width:100%;max-width:440px;height:auto;background:var(--surface)}
.gl{stroke:var(--grid);stroke-width:1}
.ax{stroke:var(--fg);stroke-width:1.6}
.tk{fill:var(--muted);font:12px var(--font)}
.axn{fill:var(--fg);font:italic 14px var(--font)}
.ln{stroke:var(--accent);stroke-width:3.2;fill:none;stroke-linecap:round}
.pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.opts{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;min-height:68px;font-size:1.22rem;width:100%}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:700;color:var(--muted);background:var(--surface)}
.opt .x{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.sel .l{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.opt.good{border-color:var(--ok);background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.good .l{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt[disabled]{cursor:default}
.fb{border-radius:10px;padding:14px 16px;font-size:1rem;line-height:1.6}
.fb.good{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
.qnav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.confirm{margin-top:18px;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.score{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:18px;margin-top:20px}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big b{font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.big span{color:var(--muted);font-size:1.1rem}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0;font-size:1rem}
.meta dt{color:var(--muted)}
.meta dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.revoir{font-size:.98rem}
.revoir b{display:block;margin-bottom:2px}
.sumtxt{overflow-wrap:anywhere;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.92rem;user-select:text;-webkit-user-select:text;margin:0}
.corr{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.corr h2{font-size:1.2rem;margin-bottom:4px}
.ci{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0}
.ci summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px}
.ci summary::-webkit-details-marker{display:none}
.ci .no{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem}
.ci.ok .no{background:var(--ok-soft);color:var(--ok)}
.ci.ko .no{background:var(--bad-soft);color:var(--bad)}
.ci .s{flex:1;min-width:0}
.ci .s small{display:block;color:var(--muted);font-size:.82rem}
.ci .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.ci .prompt{font-size:1.08rem}
.ans{font-size:1rem;display:flex;flex-direction:column;gap:6px}
.ans div{border-radius:8px;padding:8px 12px}
.ans .you.ko{background:var(--bad-soft)}
.ans .you.ok,.ans .right{background:var(--ok-soft)}
.ans .you.none{background:var(--bg)}
.ans small{color:var(--muted);display:block}
.foot{margin-top:36px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:no-preference){.opt,.card,.chip,.btn{transition:background-color .12s,border-color .12s}}
[hidden]{display:none!important}
a.btn{text-decoration:none;color:inherit}
.send{border-radius:10px;padding:14px 16px;font-size:1rem;display:flex;flex-direction:column;gap:10px;line-height:1.5}
.send b{display:block}
.send.sending{background:var(--accent-soft)}
.send.ok{background:var(--ok-soft)}
.send.ko{background:var(--bad-soft)}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:8px 0;min-height:44px;font-size:inherit}
:root{--warn:#8a5a00;--warn-soft:#fdf0d3}
.sec{font-size:1.2rem;margin-top:30px}
.joinbox{margin-top:20px;gap:12px}
.joinbox h2{font-size:1.2rem}
.codefield{min-width:180px;flex:1;max-width:260px}
.codefield input{font-size:1.5rem!important;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
.row{align-items:flex-end}
.fmtsw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fmt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;min-height:64px}
.fmt b{display:block}.fmt small{display:block;color:var(--muted);font-size:.85rem;line-height:1.3}
.fmt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.fb.warn{background:var(--warn-soft)}
.chip.verif{background:var(--warn-soft);border-color:var(--warn-soft);color:var(--warn)}
.ci.vf .no{background:var(--warn-soft);color:var(--warn)}
.ans .you.vf{background:var(--warn-soft)}
.tg.vf{background:var(--warn-soft);color:var(--warn)}
.repfield input[type=text]{font-size:1.5rem;min-height:60px;font-variant-numeric:tabular-nums}
.lab{font-weight:700;font-size:.95rem}
.mf{position:relative;display:block;min-height:64px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 14px;font-size:1.7rem;line-height:1.2;cursor:text;user-select:none;-webkit-user-select:none;overflow-x:auto}
.mf.foc{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mf.dis{background:var(--bg);cursor:default}
.mf.mstat{display:inline-block;min-height:0;border:0;padding:0;background:none;font-size:1.15em;cursor:inherit;overflow:visible;vertical-align:middle}
.mfin,#mfin{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;font-size:16px;border:0;padding:0;margin:0;caret-color:transparent}
.mfv{min-height:1.4em}
.mrow{display:inline-flex;align-items:center;flex-wrap:nowrap;min-height:1.2em}
.mrow.mroot{flex-wrap:wrap}
.mc{display:inline-block;font-variant-numeric:tabular-nums}
.mc.v{font-style:italic;font-family:Georgia,'Times New Roman',serif;padding:0 .04em}
.mc.op{margin:0 .22em}
.mfr{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle;margin:0 .18em;text-align:center}
.mfr .mrow{justify-content:center;padding:0 .2em;min-width:.9em}
.mbar{display:block;height:0;border-top:.09em solid currentColor;margin:.1em 0}
.msup{display:inline-flex;align-self:flex-start;font-size:.68em;margin-left:.06em;position:relative;top:.05em}
.msup .op{margin:0 .06em}
.mph{display:inline-flex;align-items:center;min-width:.7em;min-height:1em;border:1.5px dashed var(--muted);border-radius:4px;opacity:.7}
.mcaret{display:none;width:2px;height:1.15em;background:var(--accent);margin:0 -1px;flex:none}
.mf.foc .mcaret{display:inline-block;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.mf.foc .mcaret{animation:none}}
.kp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:460px;margin-top:12px}
.kp.kx2{grid-template-columns:repeat(auto-fit,minmax(56px,1fr));margin-top:8px}
.kb{min-width:56px;height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:inherit;font-size:1.35rem;font-weight:700;padding:0 8px;display:flex;align-items:center;justify-content:center}
.kb.dg{background:var(--bg)}
.kb.sp{font-size:1.1rem}
.kb.sys{font-size:.85rem;grid-column:span 2}.kb.sys.on{background:var(--accent-soft);border-color:var(--accent)}
.kb:active{background:var(--accent-soft)}
.kb .mfr{margin:0}.kb .mph{min-width:.55em;min-height:.5em}.kb .mrow{min-height:.7em;padding:0 .1em;font-size:.8em}
.kx{display:inline-flex;align-items:flex-start;font-style:italic;font-family:Georgia,serif}.kx .msup{top:-.1em;font-size:.7em}
.code{letter-spacing:.2em;font-size:1.1em}
.conn{display:inline-flex;align-items:center;gap:10px;font-weight:700;align-self:flex-start}
.conn i{width:12px;height:12px;border-radius:50%;background:var(--ok)}
.conn.on i{animation:pulse 1.6s ease-in-out infinite}
.conn.off{color:var(--bad)}.conn.off i{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.conn.on i{animation:none}}
.lobby .wait{font-size:1.5rem;font-weight:700;line-height:1.3}
.countdown{align-items:center;text-align:center;padding:48px 22px}
.bignum{font-size:7rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.evbar{display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.evbar .t{font-weight:700}
.timer{display:inline-flex;align-items:baseline;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:6px 14px}
.timer small{color:var(--muted)}.timer b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.timer.low{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.who{color:var(--muted)}
.donebox{align-items:center;text-align:center;padding:36px 22px}
.donebox .meta{text-align:left}
.check{width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 18px;min-height:48px;font-weight:700}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.slist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.sitem{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;min-height:64px}
.sitem small{display:block;color:var(--muted);font-size:.85rem}
.badge{display:inline-block;border-radius:8px;padding:3px 10px;font-size:.8rem;font-weight:700;white-space:nowrap}
.badge.tt{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.st-w{background:var(--warn-soft);color:var(--warn)}
.badge.st-r{background:var(--ok-soft);color:var(--ok)}
.badge.st-d{background:var(--grid);color:var(--muted)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.chk{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;min-height:52px;cursor:pointer}
.chk input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.chk small{display:block;color:var(--muted);font-size:.85rem;line-height:1.35}
.chk.wide{align-items:flex-start}
.livehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-top:14px}
.codebox{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:18px 22px;margin-top:16px}
.codebox small{color:var(--muted);display:block}
.bigcode{font-size:4rem;font-weight:700;letter-spacing:.18em;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.linkline code{display:block;background:var(--accent-soft);border-radius:6px;padding:4px 8px;font-size:.85rem;word-break:break-all;margin:4px 0 8px}
.clock{align-self:center;font-weight:700;color:var(--accent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--muted)}
.dot.on{background:var(--ok)}.dot.ok{background:var(--accent)}.dot.off{background:var(--line)}
.verif{margin-top:10px}
.vitem{background:var(--surface);border:1.5px solid var(--warn);border-radius:12px;padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.vh{font-size:1rem}
.m.small,.prompt.small{font-size:1rem}
.fig.small svg{max-width:260px}
.dlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.drow{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:8px 10px;background:var(--bg)}
.drow .no{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.drow.ok .no{background:var(--ok-soft);color:var(--ok)}.drow.ko .no{background:var(--bad-soft);color:var(--bad)}.drow.vf .no{background:var(--warn-soft);color:var(--warn)}

:root{
  --bg:#ffffff; --surface:#ffffff; --fg:#16181d; --muted:#5a6070; --line:#cdd2dc; --grid:#dfe6f3;
  --accent:#1b3fa0; --accent-fg:#ffffff; --accent-soft:#e9eefb; --tint:#f3f4f7; --margin:#d6453d;
  --ok:#1a7340; --ok-soft:#e4f3ea; --bad:#bf2a23; --bad-soft:#fbe9e7; --warn:#7d5200; --warn-soft:#fbf0d4;
  --font:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
  --serif:"STIX Two Text","Times New Roman",Times,serif;
  color-scheme:light;
}
body{font:18px/1.5 var(--font);padding-block:14px 48px}
.in{max-width:780px}
h1{font-family:var(--serif);font-weight:600;font-size:2.3rem;letter-spacing:0}
h2{font-family:var(--serif);font-weight:600}
.m,.prompt{font-family:var(--serif)}
.m{font-size:1.1em}
.top{text-transform:none;letter-spacing:0;font-size:.9rem;border-bottom:1.5px solid var(--fg);padding-bottom:8px;margin-bottom:26px}
.lead{margin-top:10px}
.sec{font-size:1.45rem;margin-top:40px}
.foot{border-top:1px solid var(--line);padding-top:14px;font-size:.88rem}
.linkbtn{font-weight:600}
.panel,.score,.confirm,.codebox,.vitem{border:0;border-radius:4px;background:var(--tint);padding:22px 24px}
.confirm{border-left:4px solid var(--accent)}
.vitem{border-left:4px solid var(--warn)}
.codebox{border-left:4px solid var(--accent)}
.joinbox{margin-top:22px}
.joinbox h2{font-size:1.35rem}
.field input[type=text],.field select,.field textarea{background:#fff;border:1.5px solid #8a91a1;border-radius:4px;min-height:52px}
.field>label,.field>legend,.lab{font-weight:600}
.btn{border-radius:4px;border:1.5px solid #8a91a1;background:#fff;font-weight:600;min-height:52px;padding:10px 22px}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.back{font-weight:600;text-decoration:underline;text-underline-offset:3px}
.tblw,.sumtxt,.ci,.sitem,.chk,.mode span,.fmt,.timer{border-radius:4px}
.badge,.tg,.fb,.send,.drow,.ans div{border-radius:3px}
.fmtsw{gap:0;max-width:520px;margin-top:14px}
.fmt{border:1.5px solid #8a91a1;border-radius:0;min-height:60px;padding:10px 16px;background:#fff}
.fmt:first-child{border-radius:4px 0 0 4px;border-right-width:0}
.fmt:last-child{border-radius:0 4px 4px 0}
.fmt.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:none}
.fmt.on small{color:#dbe3f7}
.tlist{list-style:none;margin:18px 0 0;padding:0;border-top:1.5px solid var(--fg)}
.trow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:20px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 4px;min-height:76px}
.trow:active{background:var(--accent-soft)}
.tmain{display:flex;flex-direction:column;gap:2px;min-width:0}
.card-name{font-family:var(--serif);font-weight:600;font-size:1.3rem;color:var(--accent)}
.card-desc{font-size:.95rem}
.card-ex{flex:none;align-self:center;background:none;color:var(--fg);padding:0;font-size:1.05rem;white-space:nowrap}

.qhead{border-bottom:1px solid var(--line);padding-bottom:8px}
.chips{gap:6px}
.chip{min-width:44px;height:44px;border-radius:50%;border:1.5px solid #8a91a1;background:#fff}
.chip.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.cur{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:none}
.chip.good{border-color:var(--ok)}.chip.wrong{border-color:var(--bad)}
.q{position:relative;border:1px solid var(--line);border-radius:2px;padding:26px 24px 26px 86px;

.qno{position:absolute;left:0;top:24px;width:62px;text-align:center;font-family:var(--serif);font-size:1.5rem;font-weight:600;color:var(--margin)}
.prompt{font-size:1.4rem;line-height:1.5}

.opt{background:#fff;border:1.5px solid #8a91a1;border-radius:4px;min-height:64px}
.opt .l{border-radius:50%;border-color:#8a91a1;color:var(--fg)}

.opt.good,.opt.bad{box-shadow:none}
.fb{border-left:4px solid var(--line);border-radius:0 3px 3px 0}

.ln{stroke:var(--accent)}.pt{fill:var(--accent)}

.mf.foc{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mf.dis{background:var(--tint)}
.kb{border-radius:6px;border:1px solid #9aa1b0;background:#fff;box-shadow:0 2px 0 #b9bfcc;font-weight:600}
.kb.dg{background:var(--tint)}
.kb:active{box-shadow:none;transform:translateY(2px);background:var(--accent-soft)}
.kb.sys.on{background:var(--accent-soft);border-color:var(--accent)}
.big b{font-family:var(--serif)}
.bignum,.bigcode{font-family:var(--serif)}
.evbar{background:#fff}
.timer{background:#fff;border-color:#8a91a1}
.check{border-radius:50%}
.tabs{border-bottom:1.5px solid var(--fg);gap:0;padding-bottom:0}
.tabs button{border:0;border-radius:0;background:none;border-bottom:4px solid transparent;padding:10px 16px;font-weight:600}
.tabs button.on{background:none;color:var(--accent);border-bottom-color:var(--accent)}
.sitem{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 4px;background:none}
.slist{gap:0;border-top:1px solid var(--line)}
.mixl{display:grid;gap:0;background:#fff;border:1.5px solid #8a91a1;border-radius:4px}
.mixr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line);font-weight:400}
.mixr:last-child{border-bottom:0}
.mixr select{width:92px;min-height:44px;flex:none}
@media (prefers-reduced-motion:no-preference){.trow,.fmt,.kb{transition:background-color .12s}}

label.trow input{width:24px;height:24px;flex:none;accent-color:var(--accent);margin:0}
.ano{flex:none;width:2.2em;font-family:var(--serif);font-weight:600;font-size:1.3rem;color:var(--muted);font-variant-numeric:tabular-nums}
label.trow .card-name{font-size:1.15rem}
.startbar{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border-top:1.5px solid var(--fg);padding:12px 0;margin-top:0}

.tlist li{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.tlist li label.trow{flex:1;border-bottom:0;min-width:0}
.fbtn{flex:none;min-height:44px;padding:6px 14px;margin-left:8px;background:#fff;border:1.5px solid #8a91a1;border-radius:4px;font:600 .95rem var(--font);color:var(--accent)}
.fbtn:active{background:var(--accent-soft)}

e lettre par sa valeur.","On calcule en respectant les priorités : puissances, puis multiplications et divisions, puis additions et soustractions.","On donne le résultat avec son unité."],x:[[`v = ${FX("d","t")}. Calculer v pour d = 150${NB}km et t = 2${NB}h.`,[`v = ${FX(150,2)} = 75${NB}km/h.`]],[`E = ${FX(1,2)} × m × v${SQ}. Calculer E pour m = 4${NB}kg et v = 3${NB}m/s.`,[`E = ${FX(1,2)} × 4 × 3${SQ} = ${FX(1,2)} × 4 × 9`,`= 2 × 9 = 18${NB}J.`]],["F = 1,8 × C + 32. Calculer F pour C = 20.",["F = 1,8 × 20 + 32 = 36 + 32 = 68.","La multiplication se fait avant l’addition."]],[`P = U × I. Calculer P pour U = 230${NB}V et I = 2${NB}A.`,[`P = 230 × 2 = 460${NB}W.`]]],p:`Dans ${FX(1,2)} × m × v${SQ}, seul v est au carré : on calcule v${SQ} avant de multiplier.`},a08:{m:["Somme ou différence : on met les fractions au même dénominateur, puis on ajoute ou on soustrait les numérateurs.","Produit : on multiplie les numérateurs entre eux et les dénominateurs entre eux.","Quotient : diviser par une fraction, c’est multiplier par son inverse.","Simplifier : on divise le numérateur et le dénominateur par un même nombre.","Fraction d’une quantité : on divise par le dénominateur, puis on multiplie par le numérateur."],x:[[`Calculer ${FX(2,3)} + ${FX(1,4)}.`,["Dénominateur commun : 12.",`${FX(2,3)} + ${FX(1,4)} = ${FX(8,12)} + ${FX(3,12)} = ${FX(11,12)}.`]],[`Calculer ${FX(5,6)} − ${FX(1,3)}.`,[`${FX(5,6)} − ${FX(2,6)} = ${FX(3,6)} = ${FX(1,2)}.`]],[`Calculer ${FX(3,4)} × ${FX(2,5)}.`,[`${FX("3 × 2","4 × 5")} = ${FX(6,20)} = ${FX(3,10)}.`]],[`Calculer ${FX(2,3)} ÷ ${FX(5,7)}.`,[`${FX(2,3)} × ${FX(7,5)} = ${FX(14,15)}.`]],[`Calculer ${FX(3,5)} de 40.`,["40 ÷ 5 = 8, puis 8 × 3 = 24."]],[`Donner la forme irréductible de ${FX(12,18)}.`,[`12 et 18 sont divisibles par 6 : ${FX(12,18)} = ${FX(2,3)}.`]]],p:`${FX(1,2)} + ${FX(1,3)} ne vaut pas ${FX(2,5)} : on n’additionne jamais les dénominateurs.`},a09:{m:["Deux fractions de même dénominateur : la plus grande est celle qui a le plus grand numérateur.","Sinon, on les met au même dénominateur avant de comparer.","Une fraction est supérieure à 1 quand son numérateur est plus grand que son dénominateur.","Pour comparer une fraction et un nombre décimal, on écrit la fraction sous forme décimale."],x:[[`Comparer ${FX(3,4)} et ${FX(5,8)}.`,[`${FX(3,4)} = ${FX(6,8)}.`,`6 ${GT} 5, donc ${FX(3,4)} ${GT} ${FX(5,8)}.`]],[`Comparer ${FX(2,5)} et 0,5.`,[`${FX(2,5)} = 0,4.`,`0,4 ${LT} 0,5, donc ${FX(2,5)} ${LT} 0,5.`]],[`${FX(7,6)} et ${FX(5,9)} sont-elles supérieures à 1 ?`,[`7 ${GT} 6, donc ${FX(7,6)} ${GT} 1.`,`5 ${LT} 9, donc ${FX(5,9)} ${LT} 1.`]],[`Ranger dans l’ordre croissant ${FX(3,4)}, ${FX(1,2)} et ${FX(2,3)}.`,[`Dénominateur commun 12 : ${FX(9,12)}, ${FX(6,12)} et ${FX(8,12)}.`,`${FX(1,2)} ${LT} ${FX(2,3)} ${LT} ${FX(3,4)}.`]]],p:`Un plus grand dénominateur ne donne pas une plus grande fraction : ${FX(1,8)} ${LT} ${FX(1,4)}.`},a11:{m:["On remplace x par l’abscisse du point (le premier nombre) dans l’équation.","On calcule.","Si le résultat est égal à l’ordonnée du point (le second nombre), le point appartient à la courbe. Sinon, il n’y appartient pas."],x:[["Le point A(2 ; 5) appartient-il à la droite d’équation y = 3x − 1 ?",["Pour x = 2 : 3 × 2 − 1 = 5.","C’est l’ordonnée de A : oui, A appartient à la droite."]],["Le point B(−1 ; 4) appartient-il à la droite d’équation y = 2x + 3 ?",["Pour x = −1 : 2 × (−1) + 3 = 1.","1 n’est pas égal à 4 : non, B n’appartient pas à la droite."]],[`Le point C(−2 ; 3) appartient-il à la courbe d’équation y = x${SQ} − 1 ?`,[`Pour x = −2 : (−2)${SQ} − 1 = 4 − 1 = 3.`,"Oui, C appartient à la courbe."]]],p:"C’est l’abscisse que l’on remplace dans l’équation, pas l’ordonnée."},a16:{m:[`t${NB}% d’une quantité vaut ${FX("t",100)} × quantité.`,`Proportion = ${FX("partie","tout")}. On la multiplie par 100 pour l’écrire en pourcentage.`,"Un pourcentage d’un pourcentage : on multiplie les deux proportions.",`Pour retrouver le tout, on passe par 10${NB}% ou 1${NB}%, puis on remonte à 100${NB}%.`,`À connaître : 50${NB}% est la moitié, 25${NB}% le quart, 10${NB}% le dixième.`],x:[[`Calculer 30${NB}% de 200.`,["0,3 × 200 = 60."]],["Dans une classe de 40 élèves, 12 font de l’espagnol. Quel pourcentage cela représente-t-il ?",[`${FX(12,40)} = ${FX(3,10)} = 0,3 = 30${NB}%.`]],[`40${NB}% des adhérents d’un club sont des jeunes et 50${NB}% de ces jeunes sont des filles. Quel pourcentage des adhérents sont des jeunes filles ?`,[`50${NB}% de 40${NB}% : 0,5 × 40${NB}% = 20${NB}%.`]],[`20${NB}% d’une somme valent 30${NB}€. Quelle est cette somme ?`,[`10${NB}% valent 15${NB}€.`,`100${NB}% valent 150${NB}€.`]],[`Écrire ${FX(3,4)} en pourcentage.`,[`${FX(3,4)} = 0,75 = 75${NB}%.`]]],p:`Dans ${FX("partie","tout")}, on divise par l’effectif total, pas par l’autre partie.`},a17:{m:["Dans y = mx + p, m est le coefficient directeur et p l’ordonnée à l’origine.","Pour tracer la droite : on place le point (0 ; p), puis on avance de 1 vers la droite et on monte de m (on descend si m est négatif). On relie les deux points.",`Avec deux points A et B : m = ${FX("y<sub>B</sub> − y<sub>A</sub>","x<sub>B</sub> − x<sub>A</sub>")}.`,"Si m est positif, la droite monte : la fonction est croissante. Si m est négatif, elle descend : la fonction est décroissante."],x:[["Tracer la droite d’équation y = 2x − 1.",["p = −1 : la droite passe par (0 ; −1).","m = 2 : on avance de 1 et on monte de 2, on arrive en (1 ; 1).","@fig1"]],["La droite (AB) passe par A(1 ; 2) et B(3 ; 8). Quel est son coefficient directeur ?",[`m = ${FX("8 − 2","3 − 1")} = ${FX(6,2)} = 3.`]],["Lire m et p pour la droite d’équation y = −3x + 4. La fonction est-elle croissante ?",["m = −3 et p = 4.","m est négatif : la fonction est décroissante."]]],p:"Dans la formule de m, les ordonnées sont au numérateur et les abscisses au dénominateur, dans le même ordre."},a18:{m:["On lit p : c’est l’ordonnée du point où la droite coupe l’axe des ordonnées.",`On choisit deux points de la droite placés sur des nœuds du quadrillage. m = ${FX("déplacement vertical","déplacement horizontal")}, en allant du point de gauche vers celui de droite.`,"On écrit l’équation y = mx + p."],x:[["Déterminer l’équation de la droite tracée.",["@fig2","La droite coupe l’axe des ordonnées en 1 : p = 1.",`De (0 ; 1) à (2 ; 2), on avance de 2 et on monte de 1 : m = ${FX(1,2)}.`,`Équation : y = ${FX(1,2)}x + 1.`]],["Déterminer l’équation de la droite tracée.",["@fig3","La droite coupe l’axe des ordonnées en 3 : p = 3.","De (0 ; 3) à (1 ; 1), on avance de 1 et on descend de 2 : m = −2.","Équation : y = −2x + 3."]]],p:"Une droite qui descend de gauche à droite a un coefficient directeur négatif."},a19:{m:[`On cherche la valeur qui annule l’expression : ax + b = 0 donne x = −${FX("b","a")}.`,"Si a est positif : l’expression est négative avant cette valeur et positive après.","Si a est négatif : c’est le contraire, positive avant et négative après.","Une fonction affine est croissante si a est positif, décroissante si a est négatif."],x:[[`Pour quelles valeurs de x a-t-on 2x − 6 ${GT} 0 ?`,["2x − 6 = 0 pour x = 3.","a = 2 est positif : l’expression est positive après 3.",`2x − 6 ${GT} 0 pour x ${GT} 3.`]],[`Pour quelles valeurs de x a-t-on −x + 4 ${GT} 0 ?`,["−x + 4 = 0 pour x = 4.","a = −1 est négatif : l’expression est positive avant 4.",`−x + 4 ${GT} 0 pour x ${LT} 4.`]],["Pour quelle valeur de x l’expression 3x + 5 est-elle nulle ?",[`3x = −5, donc x = −${FX(5,3)}.`]],["La fonction f définie par f(x) = −2x + 7 est-elle croissante ?",["Le coefficient de x est −2, il est négatif : f est décroissante."]]],p:"Le signe dépend du coefficient de x, pas du nombre seul : −x + 4 a un coefficient négatif."},a21:{m:["a<sup>n</sup> × a<sup>p</sup> = a<sup>n + p</sup> : pour un produit, on additionne les exposants.",`${FX("a<sup>n</sup>","a<sup>p</sup>")} = a<sup>n − p</sup> : pour un quotient, on soustrait les exposants.`,"(a<sup>n</sup>)<sup>p</sup> = a<sup>n × p</sup> : pour une puissance de puissance, on multiplie les exposants.",`a<sup>−n</sup> = ${FX(1,"a<sup>n</sup>")} : un exposant négatif donne l’inverse. Et a<sup>0</sup> = 1.`],x:[["Écrire 10<sup>3</sup> × 10<sup>4</sup> sous la forme d’une seule puissance.",["10<sup>3 + 4</sup> = 10<sup>7</sup>."]],[`Simplifier ${FX("5<sup>6</sup>","5<sup>2</sup>")}.`,["5<sup>6 − 2</sup> = 5<sup>4</sup>."]],["Écrire (2<sup>3</sup>)<sup>2</sup> sous la forme d’une seule puissance, puis calculer.",["2<sup>3 × 2</sup> = 2<sup>6</sup> = 64."]],["Écrire 2<sup>−3</sup> sous la forme d’une fraction.",[`2<sup>−3</sup> = ${FX(1,"2<sup>3</sup>")} = ${FX(1,8)}.`]],["Calculer 3<sup>4</sup>.",["3 × 3 × 3 × 3 = 81."]]],p:"3<sup>4</sup> n’est pas 3 × 4 : l’exposant compte le nombre de facteurs."},a22:{m:["On fait la même opération des deux côtés de l’égalité.","On « défait » les opérations dans l’ordre inverse : d’abord les additions et soustractions, ensuite les multiplications et divisions.","Si la lettre cherchée est au dénominateur, on commence par multiplier les deux côtés par elle."],x:[[`v = ${FX("d","t")}. Exprimer d en fonction de v et t.`,["On multiplie les deux côtés par t : d = v × t."]],[`v = ${FX("d","t")}. Exprimer t en fonction de d et v.`,["v × t = d.",`On divise par v : t = ${FX("d","v")}.`]],["U = R × I. Exprimer I en fonction de U et R.",[`On divise par R : I = ${FX("U","R")}.`]],["y = 3x + 2. Exprimer x en fonction de y.",["y − 2 = 3x.",`x = ${FX("y − 2",3)}.`]]],p:"Dans y = 3x + 2, on enlève d’abord 2, puis on divise tout le côté gauche par 3."},a23:{m:["On arrondit chaque nombre à une valeur simple, proche, avec un seul chiffre autre que zéro.","On fait le calcul de tête avec ces valeurs.","Le résultat n’est pas exact : il donne la taille du résultat et permet de repérer une réponse absurde."],x:[["Donner un ordre de grandeur de 49 × 21.",["49 est proche de 50 et 21 de 20.",`50 × 20 = 1${NN}000.`]],["Donner un ordre de grandeur de 802 ÷ 3,96.",["802 est proche de 800 et 3,96 de 4.","800 ÷ 4 = 200."]],[`Donner un ordre de grandeur de 19${NB}% de 498.`,[`19${NB}% est proche de 20${NB}% et 498 de 500.`,`20${NB}% de 500 = 100.`]]],p:"On arrondit avant de calculer, pas après : le but est un calcul faisable de tête."},a24:{m:[`On regroupe les termes de même nature : les x${SQ} avec les x${SQ}, les x avec les x, les nombres avec les nombres.`,"Un signe − devant une parenthèse change tous les signes à l’intérieur.",`Dans un produit, on multiplie les nombres entre eux et les lettres entre elles : x × x = x${SQ}.`],x:[["Réduire 3x + 5 + 2x − 7.",["(3x + 2x) + (5 − 7) = 5x − 2."]],["Réduire 4x − (x − 3).",["4x − x + 3 = 3x + 3."]],[`Réduire 2x${SQ} + 3x − x${SQ} + x.`,[`(2x${SQ} − x${SQ}) + (3x + x) = x${SQ} + 4x.`]],["Réduire 3x × 4x.",[`3 × 4 × x × x = 12x${SQ}.`]]],p:"3x + 2 ne se réduit pas : on n’ajoute pas des x et des nombres. Ce n’est pas 5x."},a25:{m:["On procède comme pour une équation : on regroupe les x d’un côté, les nombres de l’autre.","Quand on multiplie ou divise les deux côtés par un nombre négatif, on change le sens de l’inégalité.","Ajouter ou soustraire un nombre ne change jamais le sens."],x:[[`Résoudre 2x + 3 ${LT} 11.`,[`2x ${LT} 8.`,`On divise par 2, positif : x ${LT} 4.`]],[`Résoudre −3x + 1 ${GE} 10.`,[`−3x ${GE} 9.`,"On divise par −3, négatif : le sens change.",`x ${LE} −3.`]],[`Résoudre 5x − 2 ${GT} 3x + 6.`,[`5x − 3x ${GT} 6 + 2.`,`2x ${GT} 8, donc x ${GT} 4.`]],[`Résoudre 4x + 3 ${LE} 0.`,[`4x ${LE} −3.`,`x ${LE} −${FX(3,4)}.`]]],p:"Le sens change seulement quand on divise ou multiplie par un nombre négatif, pas quand le résultat est négatif."},a26:{m:["Fraction vers décimal : on divise le numérateur par le dénominateur.","Décimal vers pourcentage : on multiplie par 100. Pourcentage vers décimal : on divise par 100.","Écriture scientifique : a × 10<sup>n</sup> avec a compris entre 1 et 10 (10 exclu).","10<sup>n</sup> s’écrit avec un 1 suivi de n zéros. 10<sup>−n</sup> s’écrit avec le 1 à la n-ième place après la virgule.",`À connaître : ${FX(1,2)} = 0,5 ; ${FX(1,4)} = 0,25 ; ${FX(3,4)} = 0,75 ; ${FX(1,5)} = 0,2 ; ${FX(1,10)} = 0,1.`],x:[[`Écrire ${FX(3,4)} sous forme décimale, puis en pourcentage.`,["3 ÷ 4 = 0,75.",`0,75 = 75${NB}%.`]],["Écrire 0,2 sous la forme d’une fraction irréductible.",[`0,2 = ${FX(2,10)} = ${FX(1,5)}.`]],[`Donner l’écriture scientifique de 45${NN}000.`,[`45${NN}000 = 4,5 × 10${NN}000 = 4,5 × 10<sup>4</sup>.`]],["Donner l’écriture scientifique de 0,0032.",["La virgule se déplace de 3 rangs vers la droite : 0,0032 = 3,2 × 10<sup>−3</sup>."]],["Donner l’écriture décimale de 10<sup>−3</sup>.",[`10<sup>−3</sup> = ${FX(1,"1 000")} = 0,001.`]],[`Écrire 7${NB}% sous forme décimale.`,["7 ÷ 100 = 0,07."]]],p:`7${NB}% s’écrit 0,07 et non 0,7 : 0,7 correspond à 70${NB}%.`},a27:{m:["Un produit est nul si, et seulement si, l’un de ses facteurs est nul.","On écrit chaque facteur égal à 0 et on résout les deux petites équations.","L’équation a en général deux solutions."],x:[["Résoudre (x − 2)(x + 5) = 0.",["x − 2 = 0 ou x + 5 = 0.","x = 2 ou x = −5."]],["Résoudre (2x − 6)(x + 1) = 0.",["2x − 6 = 0 donne x = 3.","x + 1 = 0 donne x = −1.","Les solutions sont 3 et −1."]],["Résoudre x(3x − 4) = 0.",["x = 0 ou 3x − 4 = 0.",`Les solutions sont 0 et ${FX(4,3)}.`]]],p:"On ne développe surtout pas : la forme factorisée donne directement les solutions."},a28:{m:["k(a + b) = ka + kb : le nombre devant la parenthèse multiplie chaque terme.","(a + b)(c + d) = ac + ad + bc + bd : chaque terme de la première parenthèse multiplie chaque terme de la seconde.",`(a + b)${SQ} = a${SQ} + 2ab + b${SQ} et (a − b)${SQ} = a${SQ} − 2ab + b${SQ}.`,`(a + b)(a − b) = a${SQ} − b${SQ}.`,"On termine en réduisant."],x:[["Développer 3(2x − 5).",["3 × 2x − 3 × 5 = 6x − 15."]],["Développer 2x(x + 4).",[`2x × x + 2x × 4 = 2x${SQ} + 8x.`]],["Développer et réduire (x + 3)(x − 2).",[`x${SQ} − 2x + 3x − 6`,`= x${SQ} + x − 6.`]],[`Développer (x + 4)${SQ}.`,[`x${SQ} + 2 × x × 4 + 4${SQ} = x${SQ} + 8x + 16.`]],[`Développer (x − 3)${SQ}.`,[`x${SQ} − 2 × x × 3 + 3${SQ} = x${SQ} − 6x + 9.`]],["Développer (x + 5)(x − 5).",[`x${SQ} − 5${SQ} = x${SQ} − 25.`]]],p:`(x + 4)${SQ} n’est pas x${SQ} + 16 : il manque le double produit 8x.`},a29:{m:[`Une hausse de t${NB}% correspond au coefficient multiplicateur 1 + ${FX("t",100)}.`,`Une baisse de t${NB}% correspond au coefficient multiplicateur 1 − ${FX("t",100)}.`,"Dans l’autre sens : taux = (coefficient − 1) × 100. Un coefficient supérieur à 1 est une hausse, inférieur à 1 une baisse."],x:[[`Quel coefficient multiplicateur correspond à une hausse de 15${NB}% ?`,["1 + 0,15 = 1,15."]],[`Quel coefficient multiplicateur correspond à une baisse de 20${NB}% ?`,["1 − 0,20 = 0,8."]],["Quelle évolution correspond au coefficient multiplicateur 1,3 ?",[`1,3 − 1 = 0,3 : c’est une hausse de 30${NB}%.`]],["Quelle évolution correspond au coefficient multiplicateur 0,75 ?",[`0,75 − 1 = −0,25 : c’est une baisse de 25${NB}%.`]],[`Quel coefficient multiplicateur correspond à une hausse de 100${NB}% ?`,["1 + 1 = 2 : la valeur double."]]],p:`Une baisse de 20${NB}% donne 0,8 et non 0,2 : multiplier par 0,2, c’est baisser de 80${NB}%.`},a31:{m:[`Taux d’évolution = ${FX("valeur finale − valeur initiale","valeur initiale")}.`,"On multiplie par 100 pour l’écrire en pourcentage.","Un taux positif est une hausse, un taux négatif une baisse."],x:[[`Un prix passe de 50${NB}€ à 60${NB}€. Quel est le taux d’évolution ?`,[`${FX("60 − 50",50)} = ${FX(10,50)} = 0,2.`,`Le prix augmente de 20${NB}%.`]],["Un effectif passe de 80 à 60. Quel est le taux d’évolution ?",[`${FX("60 − 80",80)} = ${FX("−20",80)} = −0,25.`,`L’effectif baisse de 25${NB}%.`]],["Un nombre d’abonnés passe de 200 à 300. Quel est le taux d’évolution ?",[`${FX("300 − 200",200)} = ${FX(100,200)} = 0,5, soit +50${NB}%.`]]],p:"On divise toujours par la valeur de départ, jamais par la valeur d’arrivée."},a32:{m:["On écrit le coefficient multiplicateur de chaque évolution.","On multiplie ces coefficients : on obtient le coefficient global.","On traduit le coefficient global en taux : (coefficient − 1) × 100."],x:[[`Un prix augmente de 10${NB}%, puis de 20${NB}%. Quelle est l’évolution globale ?`,["1,1 × 1,2 = 1,32.",`Hausse globale de 32${NB}%.`]],[`Un prix augmente de 50${NB}%, puis baisse de 50${NB}%. Quelle est l’évolution globale ?`,["1,5 × 0,5 = 0,75.",`Baisse globale de 25${NB}% : le prix ne revient pas à son niveau de départ.`]],[`Un prix baisse deux fois de suite de 10${NB}%. Quel est le coefficient multiplicateur global ?`,["0,9 × 0,9 = 0,81.",`Cela correspond à une baisse de 19${NB}%.`]]],p:`On n’additionne jamais les taux : +10${NB}% puis +20${NB}% ne font pas +30${NB}%.`},a34:{m:["On écrit le coefficient multiplicateur de l’évolution de départ.",`Le coefficient de l’évolution réciproque est son inverse : ${FX(1,"coefficient")}.`,"On traduit ce coefficient en taux."],x:[[`Un prix augmente de 25${NB}%. Quelle évolution le ramène à sa valeur de départ ?`,["Coefficient : 1,25.",`${FX(1,"1,25")} = 0,8.`,`Il faut une baisse de 20${NB}%.`]],[`Un prix baisse de 50${NB}%. Quelle évolution le ramène à sa valeur de départ ?`,["Coefficient : 0,5.",`${FX(1,"0,5")} = 2.`,`Il faut une hausse de 100${NB}%.`]],[`Un prix baisse de 20${NB}%. Quelle évolution le ramène à sa valeur de départ ?`,["Coefficient : 0,8.",`${FX(1,"0,8")} = 1,25.`,`Il faut une hausse de 25${NB}%.`]]],p:`Après une hausse de 25${NB}%, une baisse de 25${NB}% ne ramène pas au départ : 1,25 × 0,75 = 0,9375.`},a39:{m:[`On calcule le coefficient directeur : m = ${FX("y<sub>B</sub> − y<sub>A</sub>","x<sub>B</sub> − x<sub>A</sub>")}.`,"On écrit y = mx + p, puis on remplace x et y par les coordonnées d’un des deux points pour trouver p.","On écrit l’équation réduite et on la vérifie avec l’autre point."],x:[["Déterminer l’équation réduite de la droite passant par A(1 ; 3) et B(3 ; 7).",[`m = ${FX("7 − 3","3 − 1")} = ${FX(4,2)} = 2.`,"Avec A : 3 = 2 × 1 + p, donc p = 1.","Équation : y = 2x + 1.","Vérification avec B : 2 × 3 + 1 = 7."]],["Déterminer l’équation réduite de la droite passant par A(0 ; 4) et B(2 ; 0).",[`m = ${FX("0 − 4","2 − 0")} = −2.`,"A est sur l’axe des ordonnées : p = 4.","Équation : y = −2x + 4."]],["Une droite a pour coefficient directeur 3 et passe par A(2 ; 1). Quelle est son ordonnée à l’origine ?",["y = 3x + p et A est sur la droite : 1 = 3 × 2 + p.","p = 1 − 6 = −5."]]],p:"Soustraire un nombre négatif, c’est ajouter : 3 − (−2) = 5."}};FICHES.c1={parts:[{t:"Multiplier ou diviser par 10, 100 ou 1 000",r:[`Multiplier par 10, 100 ou 1${NN}000 : la virgule avance de 1, 2 ou 3 rangs vers la droite.`,`Diviser par 10, 100 ou 1${NN}000 : la virgule recule de 1, 2 ou 3 rangs vers la gauche. On ajoute des zéros si besoin.`,"Multiplier par 0,1 ou par 0,01, c’est diviser par 10 ou par 100."],x:[["Calculer 4,5 × 100.",["La virgule avance de 2 rangs : 4,5 × 100 = 450."]],[`Calculer ${FX(37,"1 000")}.`,[`La virgule recule de 3 rangs : ${FX(37,"1 000")} = 0,037.`]],["Calculer 52 × 0,01.",[`52 × 0,01 = ${FX(52,100)} = 0,52.`]]]},{t:"Multiplier deux nombres décimaux",r:["On multiplie les deux nombres sans s’occuper des virgules.","Puis on place la virgule : le résultat a autant de chiffres après la virgule que les deux nombres réunis."],x:[["Calculer 3,2 × 0,4.",["32 × 4 = 128.","1 chiffre après la virgule dans 3,2 et 1 dans 0,4 : 2 en tout.","3,2 × 0,4 = 1,28."]],["Calculer 0,06 × 0,3.",["6 × 3 = 18.","2 chiffres après la virgule dans 0,06 et 1 dans 0,3 : 3 en tout.","0,06 × 0,3 = 0,018."]],["Calculer 2,5 × 0,4.",["25 × 4 = 100.","2 chiffres après la virgule en tout : 2,5 × 0,4 = 1,00 = 1."]]]},{t:"Diviser un nombre décimal par un entier",r:["On écrit la division sous la forme d’une fraction.","On divise sans la virgule, puis on remet au résultat autant de chiffres après la virgule que dans le numérateur."],x:[[`Calculer ${FX("4,8",4)}.`,[`${FX(48,4)} = 12, et 4,8 a 1 chiffre après la virgule : ${FX("4,8",4)} = 1,2.`,"Vérification : 4 × 1,2 = 4,8."]],[`Calculer ${FX("0,36",6)}.`,[`${FX(36,6)} = 6, et 0,36 a 2 chiffres après la virgule : ${FX("0,36",6)} = 0,06.`]]]},{t:"Diviser deux nombres décimaux",r:[`Diviser a par b, c’est calculer la fraction ${FX("a","b")}.`,`On multiplie le numérateur et le dénominateur par 10, 100 ou 1${NN}000 pour qu’ils deviennent entiers : la fraction garde la même valeur.`,"Il reste une division de nombres entiers, que l’on simplifie si possible."],x:[[`Calculer ${FX("7,2","0,8")}.`,[`${FX("7,2","0,8")} = ${FX("7,2 × 10","0,8 × 10")} = ${FX(72,8)} = 9.`]],[`Calculer ${FX("0,45","0,05")}.`,[`${FX("0,45","0,05")} = ${FX("0,45 × 100","0,05 × 100")} = ${FX(45,5)} = 9.`]],[`Calculer ${FX("1,2","0,03")}.`,["On multiplie par 100, car 0,03 a 2 chiffres après la virgule.",`${FX("1,2","0,03")} = ${FX("1,2 × 100","0,03 × 100")} = ${FX(120,3)} = 40.`]],[`Calculer ${FX("2,5","0,2")}.`,[`${FX("2,5","0,2")} = ${FX("2,5 × 10","0,2 × 10")} = ${FX(25,2)} = 12,5.`]],[`Calculer ${FX("0,6","1,5")}.`,[`${FX("0,6","1,5")} = ${FX("0,6 × 10","1,5 × 10")} = ${FX(6,15)} = ${FX(2,5)} = 0,4.`]],[`Calculer ${FX(240,"1,2")}.`,[`${FX(240,"1,2")} = ${FX("240 × 10","1,2 × 10")} = ${FX("2 400",12)} = 200.`]]]},{t:"Raccourcis à connaître",r:[`0,5 = ${FX(1,2)} : multiplier par 0,5, c’est prendre la moitié ; diviser par 0,5, c’est multiplier par 2.`,`0,25 = ${FX(1,4)} : multiplier par 0,25, c’est prendre le quart ; diviser par 0,25, c’est multiplier par 4.`,`0,2 = ${FX(1,5)} : multiplier par 0,2, c’est diviser par 5.`],x:[["Calculer 36 × 0,5.",["C’est la moitié de 36 : 36 × 0,5 = 18."]],[`Calculer ${FX(12,"0,25")}.`,[`${FX(12,"0,25")} = ${FX("12 × 4","0,25 × 4")} = 48.`]],["Calculer 80 × 1,25.",["80 × 1,25 = 80 × 1 + 80 × 0,25 = 80 + 20 = 100."]]]}],p:`Multiplier par un nombre plus petit que 1 donne un résultat plus petit ; diviser par un nombre plus petit que 1 donne un résultat plus grand. ${FX(12,"0,25")} vaut 48, et non 3.`};const KNOWN=[[1,2,"0,5"],[1,4,"0,25"],[3,4,"0,75"],[1,5,"0,2"],[1,8,"0,125"],[1,10,"0,1"],[1,20,"0,05"],[1,25,"0,04"],[1,50,"0,02"]];FICHES.c2={parts:[{t:"Fraction de dénominateur 10, 100 ou 1 000",r:[`On lit directement l’écriture décimale : le dénominateur 10, 100 ou 1${NN}000 donne 1, 2 ou 3 chiffres après la virgule.`],x:[[`Écrire ${FX(7,10)} et ${FX(23,100)} sous forme décimale.`,[`${FX(7,10)} = 0,7 et ${FX(23,100)} = 0,23.`]],[`Écrire ${FX(9,100)} et ${FX(125,"1 000")} sous forme décimale.`,[`${FX(9,100)} = 0,09 : il faut 2 chiffres après la virgule.`,`${FX(125,"1 000")} = 0,125.`]]]},{t:"Se ramener à 10, 100 ou 1 000",r:[`On multiplie le numérateur et le dénominateur par un même nombre pour obtenir 10, 100 ou 1${NN}000 au dénominateur.`,`Dénominateur 2 ou 5 : on vise 10. Dénominateur 4, 20, 25 ou 50 : on vise 100. Dénominateur 8 : on vise 1${NN}000.`],x:[[`Écrire ${FX(3,5)} sous forme décimale.`,[`${FX(3,5)} = ${FX("3 × 2","5 × 2")} = ${FX(6,10)} = 0,6.`]],[`Écrire ${FX(7,20)} sous forme décimale.`,[`${FX(7,20)} = ${FX("7 × 5","20 × 5")} = ${FX(35,100)} = 0,35.`]],[`Écrire ${FX(9,25)} sous forme décimale.`,[`${FX(9,25)} = ${FX("9 × 4","25 × 4")} = ${FX(36,100)} = 0,36.`]],[`Écrire ${FX(3,8)} sous forme décimale.`,[`${FX(3,8)} = ${FX("3 × 125","8 × 125")} = ${FX(375,"1 000")} = 0,375.`]]]},{t:"Les fractions à connaître",r:[`<div class="kgrid">${KNOWN.map(e=>`<span class="m">${FX(e[0],e[1])} = ${e[2]}</span>`).join("")}</div>`,`On s’en sert pour aller plus vite : ${FX(3,8)} = 3 × ${FX(1,8)} = 3 × 0,125.`],x:[[`Écrire ${FX(3,8)} sous forme décimale.`,[`${FX(3,8)} = 3 × 0,125 = 0,375.`]],[`Écrire ${FX(2,5)} sous forme décimale.`,[`${FX(2,5)} = 2 × 0,2 = 0,4.`]]]},{t:"Fraction plus grande que 1",r:["On sépare la partie entière : on enlève au numérateur le plus grand multiple du dénominateur."],x:[[`Écrire ${FX(7,4)} sous forme décimale.`,[`${FX(7,4)} = ${FX(4,4)} + ${FX(3,4)} = 1 + 0,75 = 1,75.`]],[`Écrire ${FX(13,5)} sous forme décimale.`,[`${FX(13,5)} = ${FX(10,5)} + ${FX(3,5)} = 2 + 0,6 = 2,6.`]]]},{t:"Simplifier d’abord",r:["Quand le dénominateur n’est pas l’un de ceux de la liste, on essaie de simplifier la fraction."]
